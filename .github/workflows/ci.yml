name: Quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finagent
          POSTGRES_PASSWORD: finagent
          POSTGRES_DB: finagent
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      FINAGENT_DATABASE_URL: postgresql+psycopg://finagent:finagent@localhost:5432/finagent

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip


      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy src

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests with pytest
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t finagent-api:ci .

      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint python finagent-api:ci -c "import finagent.api.app, alembic; print('imports ok')"
          docker run --rm --entrypoint sh finagent-api:ci -c "test -x /app/docker/entrypoint.sh && cd /app && alembic heads"
