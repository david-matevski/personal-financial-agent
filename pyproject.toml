[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finagent"
version = "0.1.0"
description = "Self-hosted personal-finance backend: ingest, parse, categorize, and expose bank/credit-card statements."
readme = { file = "AGENTS.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "psycopg[binary]>=3",
    "anthropic>=1,<2",
    "python-multipart>=0.0.9",
    "xlrd>=2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]
localdb = [
    "pgserver>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finagent"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be called in argument
# defaults; B008 doesn't know that by default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "xlrd.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
