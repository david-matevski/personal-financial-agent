services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finagent
      POSTGRES_PASSWORD: finagent
      POSTGRES_DB: finagent
    ports:
      - "5432:5432"
    volumes:
      - finagent-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finagent -d finagent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  finagent-db-data:
